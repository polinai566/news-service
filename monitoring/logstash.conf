input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [message] {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  if [parsed] {
    ruby {
      code => "
        if event.get('parsed').is_a?(Hash)
          event.get('parsed').each do |key, value|
            event.set(key, value) unless event.get(key)
          end
        end
      "
    }
  }
  
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  mutate {
    remove_field => ["parsed"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "news-service-logs-%{+YYYY.MM.dd}"
  }
  
}
